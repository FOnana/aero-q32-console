[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-q32-console"
version = "1.0.0"
description = "Community Windows controller for Jieli-based true-wireless earbuds"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["ruff", "pytest"]

[project.scripts]
aero-q32 = "aero_cli:main"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["F", "B", "E9"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["aero_q32", "aero_cli"]